[workspace]
authors = ["Alexander E. Schramm"]
channels = ["conda-forge"]
name = "civ4-schramm-mod"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
format = "clang-format -i **/*.cpp **/*.h **/*.inl"
test = "cmake -S . -B build-test -G Ninja -DCIV4_BUILD_TESTS=ON && cmake --build build-test && ctest --test-dir build-test --output-on-failure"

[dependencies]
clang-format = ">=23.1.4,<24"
cmake = ">=4.4.4,<5"
ninja = ">=1.13.2,<2"
python = ">=3.15.1,<3.16"

[feature.dev.dependencies]
pefile = "*"
capstone = "*"

[environments]
dev = ["dev"]
